<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Press the Play Button</title>
<style>
  /* Layout: one centred stage, the television fills it; a single reset control in the corner. Single dark look by choice. */
  :root {
    --ground: #121212;
    --ink: #d9d9d9;
    --ink-dim: #7a7a7a;
    --line: #2c2c2c;
    --focus: #f2f2f2;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    margin: 0;
    padding-inline: 16px;
    padding-block: 0;
    box-sizing: border-box;
    overflow: hidden;
  }
  main {
    height: 100%;
    display: grid;
    place-items: center;
  }
  #tv {
    display: block;
    width: min(100%, calc((100vh - 96px) * 1.196));
    max-width: 1200px;
    height: auto;
    filter: grayscale(1);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #tv.shake { animation: thud 120ms ease-out; }
  @keyframes thud {
    0% { transform: translateY(0); }
    30% { transform: translateY(1.5px); }
    100% { transform: translateY(0); }
  }

  #play { cursor: pointer; outline: none; }
  #play .edge { stroke: #7a767a; stroke-width: 2; transition: stroke 140ms ease, stroke-width 140ms ease; }
  #play .sheen { fill-opacity: 0; transition: fill-opacity 140ms ease; }
  #play:hover .edge, #play.contact .edge { stroke: #f4f4f4; stroke-width: 3; }
  #play:hover .sheen, #play.contact .sheen { fill-opacity: .9; }
  #play:focus-visible .edge { stroke: var(--focus); stroke-width: 4; }
  #play #halo { opacity: .55; transition: opacity 300ms ease; animation: breathe 2.6s ease-in-out infinite; }
  #play:hover #halo, #play.contact #halo { animation: none; opacity: .95; }
  #play.spent #halo { animation: none; opacity: 0; }
  @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: .75; } }
  @media (prefers-reduced-motion: reduce) { #play #halo { animation: none; } }
  #play.spent { cursor: default; }
  #play.spent:hover .edge { stroke: #7a767a; stroke-width: 2; }
  #play.spent:hover .sheen { fill-opacity: 0; }

  #reset {
    position: fixed;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-dim);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: color 150ms ease, border-color 150ms ease;
  }
  #reset:hover { color: var(--ink); border-color: var(--ink-dim); }
  #reset:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  #reset svg { width: 18px; height: 18px; }
</style>

<main>
  <svg id="tv" viewBox="190 30 1220 1020" role="img" aria-label="An old television with a play button">
    <defs>
      <path id="screenShape" d="M330 300 Q700 282 1070 300 Q1100 302 1102 332 Q1114 580 1102 828 Q1100 858 1070 860 Q700 878 330 860 Q300 858 298 828 Q286 580 298 332 Q300 302 330 300 Z"/>
      <clipPath id="screenClip"><use href="#screenShape"/></clipPath>

      <linearGradient id="cabinetGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2e1c21"/>
        <stop offset="1" stop-color="#170c10"/>
      </linearGradient>
      <radialGradient id="screenGrad" cx="0.5" cy="0.45" r="0.65">
        <stop offset="0" stop-color="#8fc0c3"/>
        <stop offset="0.7" stop-color="#6a9fa3"/>
        <stop offset="1" stop-color="#3f6a6e"/>
      </radialGradient>
      <linearGradient id="glareGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e8fbfc" stop-opacity="0.3"/>
        <stop offset="0.5" stop-color="#e8fbfc" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#8e8c90"/>
        <stop offset="0.5" stop-color="#cfcdd0"/>
        <stop offset="1" stop-color="#9a989c"/>
      </linearGradient>
      <linearGradient id="pleatGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#3d676b"/>
        <stop offset="0.35" stop-color="#78aaae"/>
        <stop offset="0.55" stop-color="#a3cfd1"/>
        <stop offset="1" stop-color="#3d676b"/>
      </linearGradient>
      <pattern id="pleats" width="44" height="10" patternUnits="userSpaceOnUse">
        <rect width="44" height="10" fill="url(#pleatGrad)"/>
      </pattern>
      <linearGradient id="curtainShade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0e2427" stop-opacity="0.35"/>
        <stop offset="0.25" stop-color="#0e2427" stop-opacity="0"/>
        <stop offset="1" stop-color="#0e2427" stop-opacity="0.3"/>
      </linearGradient>
      <pattern id="grille" width="10" height="10" patternUnits="userSpaceOnUse">
        <rect width="10" height="10" fill="#b4b2b6"/>
        <circle cx="5" cy="5" r="2.2" fill="#3a383c"/>
      </pattern>
      <radialGradient id="knobGrad" cx="0.35" cy="0.35" r="0.7">
        <stop offset="0" stop-color="#f2f2f2"/>
        <stop offset="0.6" stop-color="#a8a6aa"/>
        <stop offset="1" stop-color="#555257"/>
      </radialGradient>
      <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
        <rect width="4" height="2" fill="#000" fill-opacity="0.16"/>
      </pattern>
      <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c4c0c3"/>
        <stop offset="1" stop-color="#9a9699"/>
      </linearGradient>
      <clipPath id="capClip"><rect x="1293" y="813" width="42" height="94"/></clipPath>
      <filter id="glow" x="-60%" y="-30%" width="220%" height="160%">
        <feGaussianBlur stdDeviation="4"/>
      </filter>
      <filter id="soft" x="-30%" y="-100%" width="160%" height="300%">
        <feGaussianBlur stdDeviation="3"/>
      </filter>
    </defs>

    <!-- Television frame -->
    <g id="cabinet">
      <g id="antenna" stroke="#2a2026" stroke-width="10" stroke-linecap="round">
        <line x1="900" y1="205" x2="760" y2="40"/>
        <line x1="940" y1="205" x2="1080" y2="40"/>
      </g>
      <rect x="560" y="955" width="480" height="85" fill="#5a5056"/>
      <rect x="560" y="955" width="480" height="10" fill="#857a80"/>
      <rect x="200" y="200" width="1200" height="760" rx="26" fill="url(#cabinetGrad)"/>
      <rect x="200" y="200" width="1200" height="760" rx="26" fill="none" stroke="#4a3238" stroke-width="4"/>
      <rect x="228" y="228" width="1144" height="704" rx="16" fill="none" stroke="#0d0709" stroke-width="6"/>
      <path d="M318 272 Q700 252 1082 272 Q1130 275 1132 322 Q1146 580 1132 838 Q1130 885 1082 888 Q700 908 318 888 Q270 885 268 838 Q254 580 268 322 Q270 275 318 272 Z" fill="#120a0d" stroke="#8a8488" stroke-width="3"/>
    </g>

    <!-- Screen -->
    <g id="screen">
      <use href="#screenShape" fill="url(#screenGrad)"/>
    </g>

    <!-- Curtain -->
    <g id="curtain" clip-path="url(#screenClip)">
      <g id="curtain-left">
        <path d="M280 290 L704 290 L704 870 Q600 884 490 874 Q380 866 280 878 Z" fill="url(#pleats)"/>
        <path d="M280 290 L704 290 L704 870 Q600 884 490 874 Q380 866 280 878 Z" fill="url(#curtainShade)"/>
        <line x1="702" y1="290" x2="702" y2="870" stroke="#2c4c50" stroke-width="4"/>
      </g>
      <g id="curtain-right">
        <path d="M696 290 L1120 290 L1120 878 Q1020 866 910 874 Q800 884 696 870 Z" fill="url(#pleats)"/>
        <path d="M696 290 L1120 290 L1120 878 Q1020 866 910 874 Q800 884 696 870 Z" fill="url(#curtainShade)"/>
        <line x1="698" y1="290" x2="698" y2="870" stroke="#2c4c50" stroke-width="4"/>
      </g>
      <g id="curtain-valance">
        <rect x="280" y="285" width="840" height="48" fill="#5b8d91"/>
        <rect x="280" y="327" width="840" height="6" fill="#2c4c50"/>
      </g>
    </g>

    <!-- Tube effects: unpowered dimming, scanlines, power-on line -->
    <g clip-path="url(#screenClip)" pointer-events="none">
      <use id="dim" href="#screenShape" fill="#000" opacity="0.55"/>
      <rect x="280" y="280" width="840" height="600" fill="url(#scan)"/>
    </g>

    <g id="glass" pointer-events="none">
      <use href="#screenShape" fill="url(#glareGrad)"/>
      <use href="#screenShape" fill="none" stroke="#0a1416" stroke-opacity="0.55" stroke-width="10"/>
    </g>

    <!-- Control panel -->
    <g id="side-panel">
      <rect x="1162" y="290" width="176" height="500" rx="4" fill="url(#panelGrad)" stroke="#e2e0e3" stroke-width="2"/>
      <rect x="1180" y="306" width="140" height="290" fill="url(#grille)" stroke="#6a676c" stroke-width="2"/>
      <g id="knobs">
        <circle cx="1250" cy="640" r="22" fill="url(#knobGrad)" stroke="#3e3b40" stroke-width="2"/>
        <circle cx="1250" cy="700" r="22" fill="url(#knobGrad)" stroke="#3e3b40" stroke-width="2"/>
        <circle cx="1250" cy="760" r="22" fill="url(#knobGrad)" stroke="#3e3b40" stroke-width="2"/>
        <g stroke="#2a282c" stroke-width="3" stroke-linecap="round">
          <line x1="1250" y1="640" x2="1250" y2="624"/>
          <line x1="1250" y1="700" x2="1262" y2="688"/>
          <line x1="1250" y1="760" x2="1238" y2="748"/>
        </g>
      </g>
      <g id="channel-buttons">
        <rect x="1166" y="815" width="38" height="90" rx="3" fill="#e4e2e4" stroke="#7a767a" stroke-width="2"/>
        <rect x="1176" y="870" width="18" height="24" fill="#2a2226"/>
        <rect x="1209" y="815" width="38" height="90" rx="3" fill="#e4e2e4" stroke="#7a767a" stroke-width="2"/>
        <rect x="1219" y="870" width="18" height="24" fill="#2a2226"/>
        <rect x="1252" y="815" width="38" height="90" rx="3" fill="#e4e2e4" stroke="#7a767a" stroke-width="2"/>
        <rect x="1262" y="870" width="18" height="24" fill="#2a2226"/>
      </g>
    </g>

    <!-- Play button -->
    <g id="play" tabindex="0" role="button" aria-label="Play">
      <rect x="1285" y="805" width="58" height="130" fill="transparent"/>
      <rect id="halo" x="1288" y="808" width="52" height="104" rx="7" fill="none" stroke="#ffffff" stroke-width="4" filter="url(#glow)"/>
      <rect id="well" x="1295" y="815" width="38" height="0" fill="#120a0d"/>
      <g clip-path="url(#capClip)">
      <g id="cap">
        <rect class="edge" x="1295" y="815" width="38" height="90" rx="3" fill="#e4e2e4" stroke="#7a767a" stroke-width="2"/>
        <rect x="1305" y="870" width="18" height="24" fill="#2a2226"/>
        <rect class="sheen" x="1298" y="818" width="32" height="6" fill="#ffffff"/>
      </g>
      </g>
    </g>
  </svg>

  <button id="reset" type="button" aria-label="Reset">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
    </svg>
  </button>
</main>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const tv = $('tv'), play = $('play'), cap = $('cap'), well = $('well');
  const left = $('curtain-left'), right = $('curtain-right'), dim = $('dim');

  const TRAVEL = 8;           // how far the cap sinks, in drawing units
  const PRESS_MS = 1700;      // slow, laboured travel to the bottom
  const CURVE = 2.2;          // resists at first, then gives way
  const HOLD_MS = 450;        // pause at full depth before it can rise
  const OPEN_SCALE = 0.15;    // gathered curtain width

  let depth = 0;              // 0 = raised, 1 = bottomed out
  let phase = 'idle';         // idle | pressing | bottomed | returning | powering | on
  let run = 0;                // button animations
  let scene = 0;              // curtain and tube animations (cancelled only by reset)

  // ---------- drawing ----------
  function drawButton(p) {
    cap.setAttribute('transform', `translate(0 ${(TRAVEL * p).toFixed(2)})`);
    well.setAttribute('height', (TRAVEL * p).toFixed(2));
  }
  function drawCurtains(s) {   // s: 1 closed → OPEN_SCALE open
    left.setAttribute('transform', `translate(280 0) scale(${s} 1) translate(-280 0)`);
    right.setAttribute('transform', `translate(1120 0) scale(${s} 1) translate(-1120 0)`);
  }

  // ---------- timing ----------
  const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeSine = t => -(Math.cos(Math.PI * t) - 1) / 2;
  function tween(ms, step, ease = t => t, lane = 'run') {
    const cur = () => lane === 'run' ? run : scene;
    const id = cur();
    ms = reduce ? Math.min(ms, 120) : ms;
    return new Promise(resolve => {
      const t0 = performance.now();
      const tick = now => {
        if (id !== cur()) return;
        const t = Math.min(1, (now - t0) / ms);
        step(ease(t));
        t < 1 ? requestAnimationFrame(tick) : resolve();
      };
      requestAnimationFrame(tick);
    });
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));

  // ---------- sound ----------
  let ac = null;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function noise(ctx, dur) {
    const b = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * dur), ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(); s.buffer = b; return s;
  }
  // Plastic key latching into a steel bracket: a dull body thunk, then a short dry tick.
  // Crisp "ka-cha": a hard plastic snap, then the catch seating a few ms later.
  function snap(level, gap) {
    const ctx = audio(); if (!ctx) return;
    const t = ctx.currentTime + 0.005;
    const burst = (at, freq, q, gain, len) => {
      const n = noise(ctx, len + 0.01), f = ctx.createBiquadFilter(), g = ctx.createGain();
      f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.setValueAtTime(gain, at);
      g.gain.exponentialRampToValueAtTime(0.0005, at + len);
      n.connect(f).connect(g).connect(ctx.destination); n.start(t);
    };
    burst(t, 3800, 2.5, level * 1.4, 0.012);           // ka
    burst(t + gap, 6200, 1.2, level, 0.03);            // cha
    const o = ctx.createOscillator(), og = ctx.createGain();   // faint body so it isn't thin
    o.type = 'sine'; o.frequency.value = 900;
    og.gain.setValueAtTime(level * 0.25, t); og.gain.exponentialRampToValueAtTime(0.0005, t + 0.025);
    o.connect(og).connect(ctx.destination); o.start(t); o.stop(t + 0.04);
  }
  const click = () => snap(0.9, 0.022);
  const release = () => snap(0.35, 0.015);

  // ---------- press ----------
  let pressStart = 0, pressFrom = 0;
  function startPress() {
    if (phase !== 'idle' && phase !== 'returning') return;
    audio();
    run++;                                 // stop any return in progress
    phase = 'pressing';
    play.classList.add('contact');
    pressFrom = depth;
    // continue from the current depth so a re-press mid-return feels continuous
    pressStart = performance.now() - Math.pow(depth, 1 / CURVE) * PRESS_MS;
    const id = run;
    const tick = now => {
      if (id !== run || phase !== 'pressing') return;
      const t = Math.min(1, (now - pressStart) / (reduce ? 400 : PRESS_MS));
      depth = Math.pow(t, CURVE);
      drawButton(depth);
      if (t >= 1) { bottomOut(); return; }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  let holdUntil = 0;
  function bottomOut() {
    phase = 'bottomed';
    depth = 1;
    drawButton(1);
    click();
    holdUntil = performance.now() + (reduce ? 0 : HOLD_MS);
  }

  async function endPress() {
    play.classList.remove('contact');
    if (phase === 'pressing') {            // released early: spring back
      phase = 'returning';
      const from = depth;
      await tween(500 + 450 * from, k => { depth = from * (1 - k); drawButton(depth); }, easeSine);
      if (phase === 'returning') phase = 'idle';
    } else if (phase === 'bottomed') {     // full press: rise, then power the set
      phase = 'powering';
      const id = run;
      const remain = holdUntil - performance.now();
      if (remain > 0) await wait(remain);      // the button rests at the bottom before letting go
      if (id !== run) return;
      release();
      await tween(520, k => { depth = 1 - k; drawButton(depth); }, easeSine);
      if (id !== run) return;
      play.classList.add('spent');
      await wait(reduce ? 0 : 180);
      await turnOn();
    }
  }

  async function turnOn() {
    phase = 'on';
    scene++;
    await tween(3200, k => {
      drawCurtains(1 - (1 - OPEN_SCALE) * k);
      dim.setAttribute('opacity', (0.55 * (1 - k)).toFixed(3));
    }, easeInOut, 'scene');
  }

  // ---------- input ----------
  play.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    play.setPointerCapture(e.pointerId);
    startPress();
  });
  play.addEventListener('pointerup', endPress);
  play.addEventListener('pointercancel', endPress);
  play.addEventListener('lostpointercapture', () => { if (phase === 'pressing' || phase === 'bottomed') endPress(); });
  play.addEventListener('keydown', e => {
    if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); startPress(); }
  });
  play.addEventListener('keyup', e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); endPress(); }
  });
  play.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- start / reset ----------
  async function begin() {
    run++; scene++;
    phase = 'idle';
    depth = 0;
    play.classList.remove('contact', 'spent');
    drawButton(0);
    dim.setAttribute('opacity', 0.55);
    drawCurtains(OPEN_SCALE);
    await wait(reduce ? 0 : 250);
    await tween(1800, k => drawCurtains(OPEN_SCALE + (1 - OPEN_SCALE) * k), easeInOut, 'scene');
  }
  $('reset').addEventListener('click', begin);
  begin();
})();
</script>

</body></html>
