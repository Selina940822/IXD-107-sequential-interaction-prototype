<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Other Side of the Screen</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Layout: one 2000×1127 (16:9) stage scaled to fit the window; every step before entering the TV world happens inside the TV frame.
       All pictures are vector (tools/vectorize.py), so they stay sharp at any size and through every zoom. -->
  <div id="stage" aria-live="polite">

    <!-- 1. The room: a TV on a pedestal, highlighted -->
    <section id="scene-room" class="scene is-active">
      <img class="scene-bg" src="assets/images/room.svg" alt="An old television on a wooden pedestal in a dark purple room" draggable="false">
      <button id="tv-hotspot" class="halo-target" type="button" aria-label="Look at the television"></button>
    </section>

    <!-- 2–3. The TV close-up: play button, curtains, the band -->
    <section id="scene-tv" class="scene">
      <img class="scene-bg" src="assets/images/tv-closeup.svg" alt="" draggable="false">
      <div id="screen">
        <div id="band">
          <img class="band-stage" src="assets/images/band-stage.svg" alt="" draggable="false">
          <button class="member" type="button" data-i="0" aria-label="Bassist" tabindex="-1"><img src="assets/images/band-member-0.svg" alt="" draggable="false"></button>
          <button class="member" type="button" data-i="1" aria-label="Drummer" tabindex="-1"><img src="assets/images/band-member-1.svg" alt="" draggable="false"></button>
          <button class="member" type="button" data-i="2" aria-label="Keyboardist" tabindex="-1"><img src="assets/images/band-member-2.svg" alt="" draggable="false"></button>
          <button class="member" type="button" data-i="3" aria-label="Guitarist" tabindex="-1"><img src="assets/images/band-member-3.svg" alt="" draggable="false"></button>
        </div>
        <!-- 4–5. strum the strings, then tear the screen open: inside the TV screen, under the curtains -->
        <canvas id="strum" aria-label="Guitar strings"></canvas>
        <canvas id="tear" aria-label="Paper screen with a torn slit"></canvas>
        <div id="curtain-left" class="curtain"></div>
        <div id="curtain-right" class="curtain"></div>
        <div id="screen-dim"></div>
      </div>
      <div id="play" role="button" aria-label="Play" tabindex="-1">
        <div id="play-well"></div>
        <div id="play-cap"></div>
        <div id="play-halo"></div>
      </div>
    </section>

    <!-- 6. Inside: the performance space -->
    <section id="scene-inside" class="scene">
      <img class="scene-bg" src="assets/images/performance.svg" alt="The star-headed guitarist playing beside an old television that shows the band" draggable="false">
      <!-- light that moves with the music: spotlights, stage lights, rings from the star, a floor equalizer -->
      <svg id="inside-fx" viewBox="0 0 2000 1127" aria-hidden="true"></svg>
      <!-- the TV in the performance space shows the band live: the same cut-outs, swaying -->
      <div id="inside-tv">
        <div class="mini-band">
          <img class="band-stage" src="assets/images/band-stage.svg" alt="" draggable="false">
          <div class="fig" data-i="0"><img src="assets/images/band-member-0.svg" alt="" draggable="false"></div>
          <div class="fig" data-i="1"><img src="assets/images/band-member-1.svg" alt="" draggable="false"></div>
          <div class="fig" data-i="2"><img src="assets/images/band-member-2.svg" alt="" draggable="false"></div>
          <div class="fig" data-i="3"><img src="assets/images/band-member-3.svg" alt="" draggable="false"></div>
        </div>
        <div class="inside-tv-glass"></div>
      </div>
    </section>

    <!-- Dialog box (band introductions and the ending) -->
    <div id="dialog" class="dialog" hidden>
      <svg class="dialog-deco" viewBox="-230 -170 1240 460" aria-hidden="true"></svg>
      <div class="dialog-box"><p class="dialog-text"></p></div>
    </div>

    <div id="ending" hidden>
      <button id="restart" type="button">Restart</button>
    </div>
  </div>

  <audio id="music" src="assets/audio/Lilacs.mp3" preload="auto" loop></audio>

  <script src="js/sound.js"></script>
  <script src="js/press.js"></script>
  <script src="js/strum.js"></script>
  <script src="js/tear.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
